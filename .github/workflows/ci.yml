name: DayPilot checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run smoke tests
        run: node --test tests/smoke.test.mjs
      - name: Check required static assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s sitemap.xml
          test -s robots.txt
